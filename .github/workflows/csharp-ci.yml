# .github/workflows/csharp-ci.yml
name: C# CI (Simplified)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/csharp

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build and Run
      run: |
        dotnet build --configuration Release
        ./bin/Release/net8.0/HelloWorld