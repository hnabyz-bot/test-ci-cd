# .github/workflows/c-ci.yml
name: C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/c

    steps:
    - uses: actions/checkout@v3

    - name: Build and Test
      run: |
        make all
        make test
